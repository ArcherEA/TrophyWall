name: TrophyWallDB

services:
  postgres:
    image: postgres:16
    container_name: trophy-wall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trophyadmin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: trophy_wall
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: trophy-wall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
volumes:
  postgres_data:
  redis_data:
  
    