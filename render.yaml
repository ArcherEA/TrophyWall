# Render Blueprint — deploys the Trophy Wall backend (API + worker + Postgres + Redis).
# Connect this repo in the Render dashboard (New → Blueprint). Auto-deploys on push to main.
# Secrets marked `sync: false` (STEAM_API_KEY, CORS_ORIGIN) must be set once in the dashboard.

databases:
  - name: trophywall-db
    plan: free # NOTE: free Postgres is deleted after 30 days — upgrade for anything real
    databaseName: trophy_wall
    user: trophyadmin

services:
  # Redis (Render calls it "Key Value") — used by BullMQ
  - type: keyvalue
    name: trophywall-redis
    plan: free
    ipAllowList: [] # internal connections only

  # API server
  - type: web
    name: trophywall-api
    runtime: node
    rootDir: backend
    plan: free # NOTE: free web services cold-start after inactivity
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build
    preDeployCommand: pnpm exec prisma migrate deploy # run migrations before each deploy
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trophywall-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trophywall-redis
          property: connectionString
      - key: STEAM_API_BASE_URL
        value: https://api.steampowered.com
      - key: STEAM_API_KEY
        sync: false # set in dashboard (secret)
      - key: CORS_ORIGIN
        sync: false # set to your Vercel frontend URL, e.g. https://trophywall.vercel.app

  # Background sync worker (BullMQ) — separate process, shares the DB + Redis
  - type: worker
    name: trophywall-worker
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build
    startCommand: node dist/workers/steam-sync.worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trophywall-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trophywall-redis
          property: connectionString
      - key: STEAM_API_BASE_URL
        value: https://api.steampowered.com
      - key: STEAM_API_KEY
        sync: false
